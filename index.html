<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>46级复习 · 本地离线</title>
<style>
/* ============ 设计令牌：浅色（默认） ============ */
:root{
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-2:#e9edf4;
  --surface-3:#dde3ee;
  --hairline:rgba(0,0,0,.08);
  --hairline-strong:rgba(0,0,0,.14);
  --text:#1d1d1f;
  --text-secondary:#42454a;
  --text-tertiary:#86868b;
  --accent:#0a84ff;
  --accent-hover:#3398ff;
  --accent2:#30c7c0;
  --link:#0a84ff;
  --ok:#34c759;
  --bad:#ff3b30;
  --warn:#ff9f0a;
  --brand-gradient:linear-gradient(135deg,#0a84ff 0%,#5ac8fa 50%,#30d5c8 100%);
  --glass:rgba(255,255,255,.72);
  --glass-blur:blur(20px) saturate(180%);
  --shadow-1:0 2px 10px rgba(20,30,60,.08);
  --shadow-2:0 16px 40px rgba(20,30,60,.14);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-pill:980px;
  --ease-apple:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.175,.885,.32,1.1);
  --t-fast:.18s; --t-base:.32s; --t-slow:.5s;
}
[data-theme="dark"]{
  --bg:#000000;
  --surface:#161618;
  --surface-2:#1c1c1e;
  --surface-3:#2c2c2e;
  --hairline:rgba(255,255,255,.10);
  --hairline-strong:rgba(255,255,255,.18);
  --text:#f5f5f7;
  --text-secondary:#a1a1a6;
  --text-tertiary:#6e6e73;
  --accent:#2997ff;
  --accent-hover:#4aa6ff;
  --link:#2997ff;
  --ok:#30d158;
  --bad:#ff453a;
  --warn:#ff9f0a;
  --glass:rgba(22,22,24,.72);
  --shadow-1:0 2px 10px rgba(0,0,0,.4);
  --shadow-2:0 16px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:var(--bg); color:var(--text);
  transition:background var(--t-slow) var(--ease-apple), color var(--t-base) var(--ease-apple);
}
button{font-family:inherit}

/* ============ 布局骨架 ============ */
#app{display:flex; height:100vh; overflow:hidden; position:relative; z-index:1}
#fx{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.sidebar{width:240px; flex:0 0 240px; background:var(--glass); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-right:1px solid var(--hairline); display:flex; flex-direction:column; padding:18px 14px; z-index:2}
.main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative}
.content{flex:1; overflow-y:auto; padding:40px; position:relative; z-index:1}
#view{max-width:1180px; margin:0 auto}

/* ============ 侧栏 ============ */
.brand{display:flex; align-items:center; gap:12px; padding:6px 6px 16px}
.brand-mark{width:36px;height:36px;border-radius:11px; background:var(--brand-gradient); display:inline-flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-1)}
.brand-mark svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-size:17px; font-weight:600; letter-spacing:.3px}
.brand-cap{font-size:11px; color:var(--text-tertiary); margin-top:1px}
.nav{display:flex; flex-direction:column; gap:4px; margin-top:6px}
.nav-item{display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border-radius:12px; color:var(--text-secondary); cursor:pointer; border:none; background:transparent; font-size:14px; font-weight:500; transition:all .15s var(--ease-apple); position:relative; text-align:left; width:100%}
.nav-item .nav-ico{width:22px;height:22px; display:inline-flex; align-items:center; justify-content:center}
.nav-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2); color:var(--text)}
.nav-item.active{color:var(--text); background:var(--surface-2)}
.nav-item.active .nav-ico{color:var(--accent)}
.nav-item.active::before{content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--accent)}
.side-foot{margin-top:auto; font-size:11px; color:var(--text-tertiary); padding:12px 6px 0}

/* ============ 顶栏 ============ */
.topbar{display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 22px; background:var(--glass); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border-bottom:1px solid var(--hairline); position:sticky; top:0; z-index:5}
.top-left{font-size:17px; font-weight:600}
.seg{position:relative; display:inline-flex; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:3px}
.seg-thumb{position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:calc(100% - 6px); background:var(--surface); border-radius:var(--r-pill); box-shadow:var(--shadow-1); transition:transform .4s var(--ease-spring)}
.seg-btn{position:relative; z-index:1; border:none; background:transparent; padding:6px 22px; font-size:14px; font-weight:500; color:var(--text-secondary); cursor:pointer; transition:color .3s}
.seg-btn.on{color:var(--text)}
.top-right{display:flex; align-items:center; gap:14px}
.streak{display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--text-tertiary); transition:color .3s}
.streak svg{width:16px;height:16px; fill:var(--warn); stroke:none}
.streak.on{color:var(--warn)}
.date-label{font-size:13px; color:var(--text-tertiary)}

/* ============ 按钮 ============ */
.btn{font:inherit; border:none; border-radius:var(--r-pill); padding:12px 22px; font-size:14px; font-weight:500; cursor:pointer; transition:all var(--t-fast) var(--ease-apple); display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-hover); filter:brightness(1.03)}
.btn.primary:active{transform:scale(.97)}
.btn.secondary{background:var(--surface-3); color:var(--text)}
.btn.secondary:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent; border:1px solid var(--hairline-strong); color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent; border:1px solid rgba(255,59,48,.5); color:var(--bad)}
.btn.danger:hover{background:rgba(255,59,48,.12)}
.btn.sm{padding:8px 14px; font-size:13px}
.btn.big-cta{height:52px; padding:0 38px; font-size:16px; font-weight:600; margin:20px auto 0; display:flex}
.btn-icon{width:44px;height:44px;border-radius:999px;border:1px solid var(--hairline); background:var(--surface-2); color:var(--text); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:all var(--t-fast) var(--ease-apple)}
.btn-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-icon:hover{background:var(--surface-3)}
.btn-icon:active{transform:scale(.94)}
.btn-icon.pulse{animation:pulse .5s ease}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ============ 通用文字/组件 ============ */
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.h1{font-size:30px; font-weight:600; margin:6px 0 8px; letter-spacing:-.4px; line-height:1.2}
.display{font-size:44px; font-weight:600; line-height:1.12; letter-spacing:-.5px; margin:0}
.sub-lg{font-size:15px; color:var(--text-secondary); margin:8px 0 0}
.sub-sm{font-size:13px; color:var(--text-tertiary); margin-top:8px}
.view-head{margin-bottom:22px}

.card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow-1)}
.pill{display:inline-flex; align-items:center; height:22px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; background:var(--surface-3); color:var(--text-secondary)}
.pill.ok{background:rgba(52,199,89,.16); color:var(--ok)}
.pill.warn{background:rgba(255,159,10,.16); color:var(--warn)}
.pill.l1{background:rgba(10,132,255,.12); color:var(--accent)}
.pill.l2{background:rgba(10,132,255,.20); color:var(--accent)}
.pill.l3{background:rgba(10,132,255,.30); color:var(--accent)}
.pill.l4{background:rgba(48,213,200,.22); color:var(--accent2)}
.pill.l5{background:rgba(48,213,200,.36); color:var(--accent2)}
.pill-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
hr{border:none; border-top:1px solid var(--hairline); margin:18px 0}

/* ============ 首页 ============ */
.hero{text-align:center; padding:34px 0 6px}
.metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:22px 0}
.metric .stat{font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:6px; line-height:1}
.unit{font-size:14px; color:var(--text-tertiary); font-weight:500}
.metric-bar{height:6px; border-radius:999px; background:var(--surface-3); margin-top:14px; overflow:hidden}
.metric-bar i{display:block; height:100%; background:var(--brand-gradient); border-radius:999px}
.metric-bar i.ok{background:var(--ok)}

.mod-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:6px 0 28px}
.mod-tile{aspect-ratio:4/3; border-radius:var(--r-xl); border:1px solid var(--hairline); background:var(--surface); padding:26px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; cursor:pointer; text-align:left; color:var(--text); position:relative; overflow:hidden; transition:transform .25s var(--ease-apple), box-shadow .25s, border-color .25s}
.mod-tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--hairline-strong)}
.mod-tile.grad{background:linear-gradient(160deg, rgba(10,132,255,.10), rgba(48,213,200,.10)); border-color:rgba(10,132,255,.25)}
.mod-ico{width:46px;height:46px;border-radius:14px; background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; color:var(--accent)}
.mod-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mod-t{font-size:22px; font-weight:600; margin-top:auto}
.mod-d{font-size:13px; color:var(--text-secondary)}
.mod-go{font-size:13px; color:var(--accent); font-weight:600}

.home-below{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.lib-card .big-num{font-size:48px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1}
.big-sub{font-size:13px; color:var(--text-tertiary); margin:6px 0 12px}
.ex-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-size:14px; color:var(--text-secondary)}
.empty-sm{color:var(--text-tertiary); font-size:13px; padding:14px 0; text-align:center}

/* ============ 计划 ============ */
.center-wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px 0}
.plan-card{max-width:420px; width:100%; margin-top:8px}
.stepper{display:inline-flex; align-items:center; gap:0; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:4px; margin:10px 0}
.step-btn{width:44px; height:44px; border-radius:999px; border:none; background:var(--surface); color:var(--text); font-size:22px; cursor:pointer; transition:all .15s}
.step-btn:hover{background:var(--surface-3)}
.step-val{width:64px; text-align:center; border:none; background:transparent; font-size:22px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; -moz-appearance:textfield}
.step-val::-webkit-outer-spin-button,.step-val::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.save-ok{margin-top:14px}
.plan-stats{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:520px; margin:20px 0}

.ring-card{display:flex; flex-direction:column; align-items:center; gap:10px}
.ring-wrap{position:relative; width:140px; height:140px}
.ring{width:140px; height:140px}
.ring-bg{fill:none; stroke:var(--surface-3); stroke-width:10}
.ring-fg{fill:none; stroke-width:10; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%}
.ring-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:22px; font-weight:600}
.ring-num span{font-size:13px; color:var(--text-tertiary); font-weight:500}
.ring-card.solo{margin:8px 0 12px}

/* ============ 背单词 ============ */
.study-wrap{max-width:680px; width:100%}
.study-head{width:100%; margin-bottom:16px; text-align:center}
.study-count{font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; justify-content:center; gap:6px}
.count-sep,.count-target{color:var(--text-tertiary)}
.progress{height:8px; border-radius:999px; background:var(--surface-3); margin-top:12px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--brand-gradient); border-radius:999px; transition:width .4s var(--ease-apple)}
.word-card{width:100%; border-radius:var(--r-xl); padding:48px 40px; text-align:center; position:relative; background:var(--surface); border:1px solid var(--hairline); transition:transform .3s var(--ease-apple); box-shadow:var(--shadow-1)}
.word-top{position:absolute; top:18px; right:18px}
.word-main{font-size:60px; font-weight:700; letter-spacing:.5px; margin:8px 0; line-height:1.05}
.word-phon{font-size:18px; color:var(--text-secondary); margin-bottom:14px; font-style:italic}
.word-mean{font-size:18px; color:var(--text); transition:opacity .35s; margin-top:6px}
.opts-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px; width:100%}
.opt{border:1px solid var(--hairline); background:var(--surface-2); border-radius:var(--r-md); padding:18px; font-size:15px; color:var(--text); cursor:pointer; text-align:left; transition:all .15s var(--ease-apple); min-height:58px; line-height:1.4}
.opt:hover{transform:translateY(-1px); border-color:var(--accent)}
.opt.right{background:rgba(52,199,89,.16); border-color:var(--ok); color:var(--ok)}
.opt.wrong{background:rgba(255,59,48,.12); border-color:var(--bad); color:var(--bad)}
.opt.picked{border-color:var(--accent); background:rgba(10,132,255,.10)}
.opts-grid.shake{animation:shake .32s}
.opts-col{display:flex; flex-direction:column; gap:12px; margin-top:20px; width:100%}
.done-wrap .done-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:560px; margin:18px 0}

/* ============ 词库 / 题库 ============ */
.lib-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.lib-label{font-size:14px; color:var(--text-secondary); font-weight:500}
.select{height:40px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text); padding:0 14px; font-size:14px; font-family:inherit; cursor:pointer}
.drop-zone{margin-bottom:16px}
.drop-inner{display:flex; flex-direction:column; align-items:center; gap:8px; padding:22px; border:1.5px dashed var(--hairline-strong); border-radius:var(--r-md); margin-bottom:16px; color:var(--text-tertiary)}
.drop-inner svg{width:34px;height:34px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop-main{font-size:15px; color:var(--text); font-weight:500}
.table-wrap{overflow:auto; border-radius:var(--r-md); margin-top:14px; border:1px solid var(--hairline)}
table{width:100%; border-collapse:collapse; font-size:14px}
thead th{font-size:12px; font-weight:600; color:var(--text-tertiary); letter-spacing:.04em; text-align:left; padding:12px 14px; border-bottom:1px solid var(--hairline)}
tbody td{padding:12px 14px; border-bottom:1px solid var(--hairline); color:var(--text-secondary)}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
.w-word{color:var(--text); font-weight:500; font-size:15px}
.w-phon{font-style:italic}
.w-mean{max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.w-date{color:var(--text-tertiary); font-size:13px}
.danger-zone{margin-top:16px; border-color:rgba(255,59,48,.25)}
.danger-zone .eyebrow{color:var(--bad)}

/* ============ 题库 ============ */
.set-list{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border:1px solid var(--hairline); border-radius:var(--r-md); background:var(--surface-2); transition:all .15s var(--ease-apple)}
.set-row:hover{border-color:var(--hairline-strong)}
.set-row.done{border-left:3px solid var(--ok)}
.set-info{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.set-info b{font-size:15px}
.exam-q{padding:30px 26px; width:100%}
.exam-stem{font-size:18px; font-weight:500; line-height:1.5; margin-bottom:6px}
.exam-foot{width:100%; max-width:680px; margin-top:18px}
.rev-item{padding:14px 0; border-bottom:1px solid var(--hairline)}
.rev-item:last-child{border-bottom:none}
.rev-q{font-size:15px; font-weight:500; margin-bottom:6px}
.rev-a{font-size:13px; color:var(--text-secondary)}
.rev-item.r .rev-a{color:var(--ok)}
.rev-item.w .rev-a{color:var(--bad)}
.refl{width:100%; margin-top:8px; min-height:48px; border-radius:12px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text); padding:10px 12px; font-family:inherit; font-size:13px; resize:vertical}

/* ============ 图表 ============ */
.chart{margin-top:12px; overflow-x:auto}
.chart svg{width:100%; height:auto; max-height:220px}
.chart text{fill:var(--text-tertiary); font-size:11px}

/* ============ 入场动画 ============ */
.reveal{opacity:0; transform:translateY(16px); transition:opacity .5s var(--ease-apple), transform .5s var(--ease-apple)}
.reveal.in{opacity:1; transform:none}
#view.leaving{opacity:0; transform:translateY(-8px); transition:opacity .15s, transform .15s}
#view.entering{animation:enter .34s var(--ease-apple)}
@keyframes enter{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
#view.flash{animation:flash .32s var(--ease-apple)}
@keyframes flash{0%{opacity:.4} 100%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
@keyframes pulse{0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)}}

/* ============ Toast ============ */
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--glass); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--hairline); color:var(--text); padding:12px 20px; border-radius:var(--r-pill); box-shadow:var(--shadow-2); font-size:14px; opacity:0; pointer-events:none; transition:all .25s var(--ease-spring); z-index:50}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ============ 模态框 ============ */
#modalRoot{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center}
#modalRoot:empty{display:none}
.modal-mask{position:absolute; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(4px)}
.modal-card{position:relative; width:320px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:26px 24px; text-align:center; box-shadow:var(--shadow-2); animation:modalIn .24s var(--ease-apple)}
@keyframes modalIn{from{opacity:0; transform:scale(.92)} to{opacity:1; transform:scale(1)}}
.modal-ico{width:48px;height:48px;border-radius:999px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:10px}
.modal-ico svg{width:24px;height:24px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal-ico.ok{background:rgba(52,199,89,.15); color:var(--ok)}
.modal-ico.bad{background:rgba(255,59,48,.15); color:var(--bad)}
.modal-title{font-size:17px; font-weight:600; margin-bottom:6px}
.modal-msg{font-size:14px; color:var(--text-secondary); line-height:1.5; margin-bottom:18px}
.modal-actions{display:flex; gap:10px}
.modal-actions .btn{flex:1}

/* ============ 自定义圆环光标（JS 跟随，离线稳定） ============ */
body.custom-cursor, body.custom-cursor *{ cursor: none !important; }
body.custom-cursor input, body.custom-cursor textarea, body.custom-cursor .step-val{ cursor: text !important; }
.cursor-dot{ position:fixed; top:0; left:0; width:7px; height:7px; border-radius:50%; background:var(--text); pointer-events:none; z-index:9999; margin:-3.5px 0 0 -3.5px; transition:opacity .2s; }
.cursor-ring{ position:fixed; top:0; left:0; width:34px; height:34px; border-radius:50%; border:2px solid var(--text); opacity:.45; pointer-events:none; z-index:9998; margin:-17px 0 0 -17px; transition:width .18s var(--ease-apple), height .18s var(--ease-apple), margin .18s var(--ease-apple), background .18s, border-color .18s, opacity .18s; }
.cursor-ring.hover{ width:48px; height:48px; margin:-24px 0 0 -24px; background:rgba(10,132,255,.14); border-color:var(--accent); opacity:1; }
@media (hover:none){ body.custom-cursor, body.custom-cursor *{ cursor:auto !important; } .cursor-dot, .cursor-ring{ display:none !important; } }

/* ============ 首页励志名言 + 词库词高亮 ============ */
.quote-en{font-size:16px; line-height:1.65; max-width:780px; margin:10px auto 0; font-style:normal}
.quote-by{color:var(--text-tertiary); font-style:italic; font-weight:400; margin-left:4px}
.hl{font-weight:600; padding:0 1px}
.hl1{color:#0a84ff; border-bottom:2px solid rgba(10,132,255,.4)}
.hl2{color:#0f9d8f; border-bottom:2px solid rgba(15,157,143,.4)}
.hl3{color:#7c5cff; border-bottom:2px solid rgba(124,92,255,.4)}

/* ============ 答题对勾 / 叉叉动效 ============ */
.opt{position:relative; overflow:hidden}
.opts-grid .opt, .opts-col .opt{padding-left:46px}
.opt-mark{position:absolute; left:15px; top:50%; width:22px; height:22px; transform:translateY(-50%) scale(0); opacity:0}
.opt-mark svg{width:22px; height:22px; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.opt-mark.check svg{stroke:var(--ok)}
.opt-mark.cross svg{stroke:var(--bad)}
.opt.right .opt-mark.check, .opt.wrong .opt-mark.cross{animation:popMark .42s var(--ease-spring) forwards}
@keyframes popMark{0%{transform:translateY(-50%) scale(0); opacity:0} 55%{transform:translateY(-50%) scale(1.18); opacity:1} 100%{transform:translateY(-50%) scale(1); opacity:1}}

/* ============ 按钮动效（hover 抬升 + 点击水波纹） ============ */
.btn{position:relative; overflow:hidden}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(10,132,255,.26)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-icon{overflow:hidden}
.btn-icon:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(10,132,255,.22)}
.btn-icon:active{transform:scale(.92)}
.nav-item{position:relative; overflow:hidden; transition:background .2s, color .2s}
.nav-item:hover{background:var(--surface-2)}
.mod-tile::after{content:''; position:absolute; inset:0; background:radial-gradient(120% 120% at 82% 0%, rgba(10,132,255,.12), transparent 60%); opacity:0; transition:opacity .3s; pointer-events:none}
.mod-tile:hover{transform:translateY(-4px); box-shadow:var(--shadow-2); border-color:var(--hairline-strong)}
.mod-tile:hover::after{opacity:1}
.opt:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 16px rgba(10,132,255,.16)}
.opt:active{transform:translateY(0) scale(.985)}
.ripple{position:absolute; border-radius:50%; background:rgba(0,0,0,.12); transform:scale(0); animation:ripple .6s ease-out; pointer-events:none}
@keyframes ripple{to{transform:scale(2.6); opacity:0}}

/* ============ 全屏态 ============ */
body.fs .sidebar, body.fs .topbar, body.fs #fx{display:none}
body.fs .content{padding:0}
body.fs #view{max-width:920px; min-height:100vh; display:flex; flex-direction:column; justify-content:center}
body.fs .study-wrap, body.fs .exam-wrap{margin-top:0}

/* ============ 错题本 ============ */
.mistake-list{display:flex; flex-direction:column; gap:6px; padding:6px 0}
.mistake-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 12px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--hairline)}
.mw{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0}
.mw b{font-size:15px; font-weight:600}
.mphon{font-size:12px; color:var(--text-tertiary)}
.mmean{font-size:13px; color:var(--text-secondary)}
.pill.bad{background:rgba(255,59,48,.14); color:var(--bad)}

/* ============ 响应式 ============ */
@media (max-width:1100px){ .metrics{grid-template-columns:repeat(2,1fr)} .mod-grid{grid-template-columns:repeat(2,1fr)} .home-below{grid-template-columns:1fr} }
@media (max-width:760px){ .sidebar{width:72px; flex:0 0 72px; padding:14px 8px} .brand-cap,.nav-item span:last-child,.side-foot{display:none} .nav-item{justify-content:center} .content{padding:24px 16px} .metrics,.mod-grid,.plan-stats,.done-stats{grid-template-columns:1fr 1fr} .display{font-size:34px} .word-main{font-size:46px} }
@media (prefers-reduced-motion:reduce){ .reveal{opacity:1!important; transform:none!important} .seg-thumb,.progress i,.ring-fg{transition:none!important} }
</style>
